# Exact community symbols consumed by enterprise runtime code. Any new entry is
# a deliberate expansion of the supported cross-license API.
[enterprise_public_api]
"shim.api.v1.chat" = ["router"]
"shim.api.v1.gemini" = ["router"]
"shim.api.v1.messages" = ["router"]
"shim.api.v1.responses" = ["router"]
"shim.billing.attribution" = ["UNTAGGED", "normalize_attribution"]
"shim.billing.pricing" = ["DEFAULT_PRICE_BOOK", "compute_cost_usd"]
"shim.core.circuit_breaker" = ["validate_circuit_limits"]
"shim.core.community_config" = ["CommunitySettings"]
"shim.core.http" = ["install_http_middleware"]
"shim.gateway.admission" = ["LoopDetectionResult"]
"shim.gateway.api.errors" = ["gateway_exception_handler"]
"shim.gateway.auth" = ["authentication_error", "select_gateway_credential"]
"shim.gateway.contracts" = ["FrozenContractModel"]
"shim.gateway.contracts.context" = ["AuditPolicy", "TenantPolicy", "TierPolicy"]
"shim.gateway.contracts.errors" = ["ScanAnalysisError"]
"shim.gateway.contracts.ids" = [
  "ApiKeyId",
  "ModelId",
  "ProviderId",
  "RequestId",
  "SecretRef",
  "TenantId",
  "UserId",
]
"shim.gateway.contracts.inference" = [
  "ScanEntity",
  "ScanInput",
  "ScanPolicy",
  "ScanVerdict",
]
"shim.gateway.contracts.principal" = [
  "ActorType",
  "AuthenticatedPrincipal",
  "validate_actor_identity",
]
"shim.gateway.kernel.gateway_kernel" = ["GatewayKernel"]
"shim.gateway.kernel.result" = ["AdmissionState", "PreparedInference"]
"shim.gateway.pipeline.anthropic_execution" = ["AnthropicExecution"]
"shim.gateway.pipeline.authenticate" = ["GatewayRequestMetadata"]
"shim.gateway.pipeline.google_execution" = ["GoogleExecution"]
"shim.gateway.pipeline.openai_execution" = ["OpenAIExecution"]
"shim.gateway.pipeline.privacy" = ["ScanPrivacyOutcome", "ScanPrivacyStage"]
"shim.gateway.request_policy" = ["RequestPolicyContext", "ResolvedRequestPolicy"]
"shim.gateway.streaming.finalization" = ["StreamFinalization"]
"shim.gateway.usage" = ["UsageFailureReason", "UsageLimitExceeded"]
"shim.observability.logging" = [
  "configure_error_reporting",
  "configure_logging",
]
"shim.observability.metrics" = ["REQUESTS_TOTAL", "bounded_label"]
"shim.observability.tracing" = [
  "configure_tracing",
  "shutdown_tracing",
  "start_span",
]
"shim.privacy.classification" = ["content_ref"]
"shim.privacy.continuation" = ["PrivacyContinuationUnavailableError"]
"shim.privacy.pii_scrubber" = ["PIIScrubberService", "effective_pii_config"]
"shim.privacy.retention" = ["REQUEST_PRIVACY_RETENTION"]
"shim.secrets.credentials" = ["EphemeralProviderCredential"]
"shim.services.gateway.service" = ["GatewayService"]

