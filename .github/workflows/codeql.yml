# Static analysis. Scorecard grades the SAST check on whether a recognised
# analyser runs, and a security product that ships no static analysis of its
# own is a hard question to answer in a procurement review.
#
# The default query suite runs here on purpose. security-extended finds more
# and reports more, and a two-person team that stops reading its own alerts is
# worse off than one that reads every alert it gets. Widen it once the default
# suite is quiet.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "42 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:python"
