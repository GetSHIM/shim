name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to ghcr.io
        run: |
          echo '${{ github.token }}' \
            | docker login ghcr.io --username '${{ github.actor }}' --password-stdin

      - name: Read the version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<TAGS"
            echo "ghcr.io/getshim/shim:$version"
            case "$version" in
              *-*) ;;
              *) echo "ghcr.io/getshim/shim:latest" ;;
            esac
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push the community image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          provenance: mode=max
          sbom: true

      - name: Attest the build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/getshim/shim
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Copy the provenance bundle into the release
        id: bundle
        run: |
          src='${{ steps.attest.outputs.bundle-path }}'
          case "$src" in
            *.jsonl) dest="shim-${{ steps.version.outputs.value }}.intoto.jsonl" ;;
            *) dest="shim-${{ steps.version.outputs.value }}.sigstore.json" ;;
          esac
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Smoke the published image
        run: |
          container=shim-release-smoke
          trap 'docker stop "$container" >/dev/null 2>&1 || true' EXIT
          docker run --rm --detach --name "$container" --network host \
            --env SHIM_API_KEY=release-smoke-only-key \
            ghcr.io/getshim/shim@${{ steps.build.outputs.digest }}
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs "$container"
          exit 1

      - name: Generate the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/getshim/shim@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: shim-${{ steps.version.outputs.value }}.spdx.json
          upload-artifact: false

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            v0.*) maturity=--prerelease ;;
            *) maturity= ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $maturity \
            "shim-${{ steps.version.outputs.value }}.spdx.json" \
            "${{ steps.bundle.outputs.path }}"
