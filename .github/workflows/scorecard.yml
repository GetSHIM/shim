# OpenSSF Scorecard reads this repository the way a buyer's security review
# would: twenty checks, each scored out of ten, run by a third party rather
# than asserted by us. publish_results has to stay true, because the README
# badge and the public viewer read the published run, not this file.
name: Scorecard

on:
  # Branch-Protection is one of the graded checks, so re-score when a rule
  # changes rather than waiting for the weekly run.
  branch_protection_rule:
  schedule:
    - cron: "31 5 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Analyze the repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Write the findings to the code scanning tab.
      security-events: write
      # Sign the published result, so the public score cannot be forged.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the raw result for five days
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload the findings to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
