name: Update model catalog

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-catalog-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Refresh catalog
        run: uv run --locked python scripts/sync_models_dev.py --report "$RUNNER_TEMP/retirements.md"
      # A pull request opened with the workflow token starts no checks; the app's token does.
      - name: Mint the catalog app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CATALOG_APP_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          repositories: shim
      - name: Open update pull request
        env:
          BRANCH: automation/models-dev-catalog
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$(git status --porcelain -- src/shim/billing/model_catalog.json)" ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
          fi
          git switch -c "$BRANCH"
          git add src/shim/billing/model_catalog.json
          git commit -m "chore: update Models.dev catalog"
          git push --force-with-lease origin "HEAD:$BRANCH"

          if [ -z "$(gh pr list --base "$PR_BASE" --head "$BRANCH" --state open --json url --jq '.[0].url')" ]; then
            {
              echo "Automated catalog refresh from https://models.dev/api.json. Pricing feeds cost accounting, so this reaches main through review."
              echo
              cat "$RUNNER_TEMP/retirements.md"
            } > "$RUNNER_TEMP/body.md"
            gh pr create \
              --base "$PR_BASE" \
              --head "$BRANCH" \
              --title "chore: update Models.dev catalog" \
              --body-file "$RUNNER_TEMP/body.md"
          fi
