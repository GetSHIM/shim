name: Update model catalog

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# Nothing above job level. The one job that opens a pull request asks for the
# writes it needs, and a scheduled workflow is exactly the kind that should not
# hand a broad token to every step it runs.
permissions:
  contents: read

concurrency:
  group: model-catalog-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the automation branch
      pull-requests: write # open the catalog update
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Refresh catalog
        run: uv run --locked python scripts/sync_models_dev.py
      - name: Open update pull request
        env:
          BRANCH: automation/models-dev-catalog
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$(git status --porcelain -- src/shim/billing/model_catalog.json)" ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH"
          fi
          git switch -c "$BRANCH"
          git add src/shim/billing/model_catalog.json
          git commit -m "chore: update Models.dev catalog"
          git push --force-with-lease origin "HEAD:$BRANCH"

          if [ -z "$(gh pr list --base "$PR_BASE" --head "$BRANCH" --state open --json url --jq '.[0].url')" ]; then
            gh pr create \
              --base "$PR_BASE" \
              --head "$BRANCH" \
              --title "chore: update Models.dev catalog" \
              --body "Automated catalog refresh from https://models.dev/api.json. Pricing feeds cost accounting, so this reaches main through review."
          fi
