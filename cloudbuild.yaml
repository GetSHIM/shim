steps:
  - id: validate-deployment
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:570dc7ce2876a2810dbf80f1d2520c1654aa218a7f1347715243a79c98d166ae
    entrypoint: bash
    env:
      - ACTUAL_PROJECT_ID=$PROJECT_ID
      - BUILD_ID=$BUILD_ID
      - DEPLOY_LOCK_URI=${_DEPLOY_LOCK_URI}
      - DEPLOY_PROJECT_ID=${_DEPLOY_PROJECT_ID}
      - DEPLOY_TRIGGER_ID=${_DEPLOY_TRIGGER_ID}
      - FRONTEND_ORIGINS=${_FRONTEND_ORIGINS}
      - IMAGE_TAG=$COMMIT_SHA
      - MAX_INSTANCES=${_MAX_INSTANCES}
      - SHORT_SHA=$SHORT_SHA
      - WORKER_INSTANCES=${_WORKER_INSTANCES}
    args:
      - -ceu
      - |
        test -n "$$DEPLOY_PROJECT_ID" || { echo "_DEPLOY_PROJECT_ID is required"; exit 1; }
        test "$$ACTUAL_PROJECT_ID" = "$$DEPLOY_PROJECT_ID" || { echo "deployment project mismatch"; exit 1; }
        [[ "$$BUILD_ID" =~ ^[0-9a-f-]{36}$$ ]] || { echo "BUILD_ID must be a UUID"; exit 1; }
        [[ "$$DEPLOY_LOCK_URI" =~ ^gs://[^/]+/.+$$ ]] || { echo "_DEPLOY_LOCK_URI must be an object URI"; exit 1; }
        [[ "$$DEPLOY_TRIGGER_ID" =~ ^[0-9a-f-]{36}$$ ]] || { echo "_DEPLOY_TRIGGER_ID must be a UUID"; exit 1; }
        test -n "$$FRONTEND_ORIGINS" || { echo "_FRONTEND_ORIGINS is required"; exit 1; }
        [[ "$$IMAGE_TAG" =~ ^[0-9a-f]{40}$$ ]] || { echo "COMMIT_SHA must be a full Git commit SHA"; exit 1; }
        [[ "$$MAX_INSTANCES" =~ ^[1-9][0-9]*$ ]] || { echo "_MAX_INSTANCES must be a positive decimal integer"; exit 1; }
        [[ "$$SHORT_SHA" =~ ^[0-9a-f]{7}$$ ]] || { echo "SHORT_SHA must be a seven-character Git SHA"; exit 1; }
        [[ "$$WORKER_INSTANCES" =~ ^[1-9][0-9]*$ ]] || { echo "_WORKER_INSTANCES must be a positive decimal integer"; exit 1; }

  - id: build-image
    name: gcr.io/kaniko-project/executor@sha256:4e7a52dd1f14872430652bb3b027405b8dfd17c4538751c620ac005741ef9698
    args:
      - --destination=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA
      - --cache=true
      - --cache-ttl=168h
      - --context=.
      - --dockerfile=ee/Dockerfile

  - id: acquire-deployment-lock
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:570dc7ce2876a2810dbf80f1d2520c1654aa218a7f1347715243a79c98d166ae
    entrypoint: bash
    env:
      - BUILD_ID=$BUILD_ID
      - DEPLOY_LOCK_URI=${_DEPLOY_LOCK_URI}
      - DEPLOY_PROJECT_ID=${_DEPLOY_PROJECT_ID}
      - DEPLOY_TRIGGER_ID=${_DEPLOY_TRIGGER_ID}
      - REGION=${_REGION}
    args:
      - -ceu
      - |
        for attempt in {1..360}; do
          if printf '%s\n' "$$BUILD_ID" | gcloud storage cp - "$$DEPLOY_LOCK_URI" --if-generation-match=0 >/dev/null 2>&1; then
            lock_generation="$$(gcloud storage objects describe "$$DEPLOY_LOCK_URI" --format='value(generation)')"
            lock_owner="$$(gcloud storage cat "$$DEPLOY_LOCK_URI#$$lock_generation")"
            test "$$lock_owner" = "$$BUILD_ID" || { echo "deployment lock ownership verification failed"; exit 1; }
            printf '%s\n' "$$lock_generation" > /workspace/deployment-lock-generation
            break
          fi

          existing_generation="$$(gcloud storage objects describe "$$DEPLOY_LOCK_URI" --format='value(generation)' 2>/dev/null || true)"
          if test -n "$$existing_generation"; then
            owner_build="$$(gcloud storage cat "$$DEPLOY_LOCK_URI#$$existing_generation" 2>/dev/null || true)"
            owner_status="$$(gcloud builds describe "$$owner_build" --project="$$DEPLOY_PROJECT_ID" --region="$$REGION" --format='value(status)' 2>/dev/null || true)"
            case "$$owner_status" in
              SUCCESS|FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                gcloud storage rm "$$DEPLOY_LOCK_URI" --if-generation-match="$$existing_generation" --quiet >/dev/null 2>&1 || true
                ;;
            esac
          fi
          sleep 5
        done
        test -s /workspace/deployment-lock-generation || { echo "timed out waiting for the production deployment lock"; exit 1; }

        latest_build="$$(gcloud builds list --project="$$DEPLOY_PROJECT_ID" --region="$$REGION" --filter="buildTriggerId:$$DEPLOY_TRIGGER_ID AND status=(QUEUED OR PENDING OR WORKING OR SUCCESS)" --sort-by=~createTime --limit=1 --format='value(id)')"
        if test "$$latest_build" != "$$BUILD_ID"; then
          gcloud storage rm "$$DEPLOY_LOCK_URI" --if-generation-match="$$lock_generation" --quiet >/dev/null 2>&1 || true
          echo "a newer main deployment superseded this build"
          exit 1
        fi

  - id: deploy-migration
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:570dc7ce2876a2810dbf80f1d2520c1654aa218a7f1347715243a79c98d166ae
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_RESOURCE_PREFIX}-migrate
      - --project=${_DEPLOY_PROJECT_ID}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --command=alembic
      - --args=-c,ee/alembic.ini,upgrade,head
      - --tasks=1
      - --max-retries=0
      - --task-timeout=10m
      - --service-account=${_MIGRATION_SERVICE_ACCOUNT}
      - --network=${_VPC_NETWORK}
      - --subnet=${_VPC_SUBNET}
      - --vpc-egress=private-ranges-only
      - --set-secrets=DATABASE_URL=${_SECRET_PREFIX}-migration-database-url:1,REDIS_URL=${_SECRET_PREFIX}-redis-url:1,SUPABASE_URL=${_SECRET_PREFIX}-supabase-url:1,SUPABASE_KEY=${_SECRET_PREFIX}-supabase-key:1,SECRET_KEY=${_SECRET_PREFIX}-secret-key:1
      - --set-env-vars=ENVIRONMENT=production,SECRET_BACKEND=gcp_secret_manager,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,LOG_LEVEL=INFO,DATABASE_POOL_SIZE=${_DATABASE_POOL_SIZE},DATABASE_MAX_OVERFLOW=${_DATABASE_MAX_OVERFLOW}

  - id: run-migration
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:570dc7ce2876a2810dbf80f1d2520c1654aa218a7f1347715243a79c98d166ae
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_RESOURCE_PREFIX}-migrate
      - --project=${_DEPLOY_PROJECT_ID}
      - --region=${_REGION}
      - --wait

  - id: deploy-gateway
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:570dc7ce2876a2810dbf80f1d2520c1654aa218a7f1347715243a79c98d166ae
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_RESOURCE_PREFIX}-gateway
      - --project=${_DEPLOY_PROJECT_ID}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/${_IMAGE_NAME}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --port=8000
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=3
      - --max=${_MAX_INSTANCES}
      - --cpu=2
      - --memory=4Gi
      - --concurrency=80
      - --timeout=600s
      - --no-invoker-iam-check
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --network=${_VPC_NETWORK}
      - --subnet=${_VPC_SUBNET}
      - --vpc-egress=private-ranges-only
      - --command=uvicorn
      - --args=shim_enterprise.application:create_enterprise_app,--factory,--host,0.0.0.0,--port,8000,--workers,1
      - --revision-suffix=rel-$SHORT_SHA
      - --deploy-health-check
      - --no-traffic
      - --set-secrets=DATABASE_URL=${_SECRET_PREFIX}-database-url:1,REDIS_URL=${_SECRET_PREFIX}-redis-url:1,SUPABASE_URL=${_SECRET_PREFIX}-supabase-url:1,SUPABASE_KEY=${_SECRET_PREFIX}-supabase-key:1,SECRET_KEY=${_SECRET_PREFIX}-secret-key:1,ENCRYPTION_KEY=${_SECRET_PREFIX}-encryption-key:1,SENTRY_DSN=${_SECRET_PREFIX}-sentry-dsn:1,OTEL_EXPORTER_OTLP_ENDPOINT=${_SECRET_PREFIX}-otel-exporter-otlp-endpoint:1,OTEL_EXPORTER_OTLP_HEADERS=${_SECRET_PREFIX}-otel-exporter-otlp-headers:1
      - --set-env-vars=^@^BACKEND_CORS_ORIGINS=${_FRONTEND_ORIGINS}@ENVIRONMENT=production@SECRET_BACKEND=gcp_secret_manager@GOOGLE_CLOUD_PROJECT=$PROJECT_ID@LOG_LEVEL=INFO@OTEL_SERVICE_NAME=${_RESOURCE_PREFIX}-gateway@DATABASE_POOL_SIZE=${_DATABASE_POOL_SIZE}@DATABASE_MAX_OVERFLOW=${_DATABASE_MAX_OVERFLOW}@LEMON_SQUEEZY_SOLO_PRO_MONTHLY_VARIANT_ID=${_LEMON_SQUEEZY_SOLO_PRO_MONTHLY_VARIANT_ID}@LEMON_SQUEEZY_SOLO_PRO_YEARLY_VARIANT_ID=${_LEMON_SQUEEZY_SOLO_PRO_YEARLY_VARIANT_ID}@LEMON_SQUEEZY_AGENCY_MONTHLY_VARIANT_ID=${_LEMON_SQUEEZY_AGENCY_MONTHLY_VARIANT_ID}@LEMON_SQUEEZY_AGENCY_YEARLY_VARIANT_ID=${_LEMON_SQUEEZY_AGENCY_YEARLY_VARIANT_ID}@LEMON_SQUEEZY_SOLO_PRO_MONTHLY_CHECKOUT_URL=${_LEMON_SQUEEZY_SOLO_PRO_MONTHLY_CHECKOUT_URL}@LEMON_SQUEEZY_SOLO_PRO_YEARLY_CHECKOUT_URL=${_LEMON_SQUEEZY_SOLO_PRO_YEARLY_CHECKOUT_URL}@LEMON_SQUEEZY_AGENCY_MONTHLY_CHECKOUT_URL=${_LEMON_SQUEEZY_AGENCY_MONTHLY_CHECKOUT_URL}@LEMON_SQUEEZY_AGENCY_YEARLY_CHECKOUT_URL=${_LEMON_SQUEEZY_AGENCY_YEARLY_CHECKOUT_URL}@COMPLIANCE_EMAIL_FROM=${_COMPLIANCE_EMAIL_FROM}

  - id: verify-gateway
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:570dc7ce2876a2810dbf80f1d2520c1654aa218a7f1347715243a79c98d166ae
    entrypoint: bash
    env:
      - CANDIDATE_REVISION=${_RESOURCE_PREFIX}-gateway-rel-$SHORT_SHA
      - DEPLOY_PROJECT_ID=${_DEPLOY_PROJECT_ID}
      - GATEWAY_NAME=${_RESOURCE_PREFIX}-gateway
      - REGION=${_REGION}
      - RELEASE_TAG=release-$SHORT_SHA
    args:
      - -ceu
      - |
        remove_release_tag() {
          gcloud run services update-traffic "$$GATEWAY_NAME" --project="$$DEPLOY_PROJECT_ID" --region="$$REGION" --remove-tags="$$RELEASE_TAG" >/dev/null 2>&1 || true
        }
        trap remove_release_tag EXIT
        trap 'exit 1' INT TERM

        gcloud run services update-traffic "$$GATEWAY_NAME" --project="$$DEPLOY_PROJECT_ID" --region="$$REGION" --update-tags="$$RELEASE_TAG=$$CANDIDATE_REVISION"
        python3 - "$$DEPLOY_PROJECT_ID" "$$GATEWAY_NAME" "$$REGION" "$$RELEASE_TAG" <<'PY'
        import json
        import subprocess
        import sys
        import urllib.request

        project, gateway, region, tag = sys.argv[1:]
        service = json.loads(
            subprocess.check_output(
                [
                    "gcloud",
                    "run",
                    "services",
                    "describe",
                    gateway,
                    f"--project={project}",
                    f"--region={region}",
                    "--format=json",
                ],
                text=True,
            )
        )
        candidate_url = next(
            route["url"]
            for route in service["status"]["traffic"]
            if route.get("tag") == tag
        )
        with urllib.request.urlopen(f"{candidate_url}/health", timeout=30) as response:
            payload = json.load(response)

        expected = {
            "status": "ok",
            "database": "connected",
            "redis": "connected",
        }
        if any(payload.get(key) != value for key, value in expected.items()):
            raise SystemExit(f"candidate gateway health failed: {payload}")
        PY
        gcloud run services update-traffic "$$GATEWAY_NAME" --project="$$DEPLOY_PROJECT_ID" --region="$$REGION" --remove-tags="$$RELEASE_TAG"
        trap - EXIT

  - id: deploy-outbox-worker
