      - --set-env-vars=ENVIRONMENT=production,SECRET_BACKEND=gcp_secret_manager,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,LOG_LEVEL=INFO,OTEL_SERVICE_NAME=${_RESOURCE_PREFIX}-ai-act-worker,DATABASE_POOL_SIZE=${_DATABASE_POOL_SIZE},DATABASE_MAX_OVERFLOW=${_DATABASE_MAX_OVERFLOW}

  - id: promote-release
    name: gcr.io/google.com/cloudsdktool/cloud-sdk@sha256:570dc7ce2876a2810dbf80f1d2520c1654aa218a7f1347715243a79c98d166ae
    entrypoint: bash
    env:
      - BUILD_ID=$BUILD_ID
      - DEPLOY_LOCK_URI=${_DEPLOY_LOCK_URI}
      - DEPLOY_PROJECT_ID=${_DEPLOY_PROJECT_ID}
      - DEPLOY_TRIGGER_ID=${_DEPLOY_TRIGGER_ID}
      - REGION=${_REGION}
      - RESOURCE_PREFIX=${_RESOURCE_PREFIX}
      - SHORT_SHA=$SHORT_SHA
    args:
      - -ceu
      - |
        test -s /workspace/deployment-lock-generation || { echo "deployment lock generation is missing"; exit 1; }
        lock_generation="$$(< /workspace/deployment-lock-generation)"
        lock_owner="$$(gcloud storage cat "$$DEPLOY_LOCK_URI#$$lock_generation")"
        test "$$lock_owner" = "$$BUILD_ID" || { echo "deployment lock ownership verification failed"; exit 1; }

        release_lock() {
          gcloud storage rm "$$DEPLOY_LOCK_URI" --if-generation-match="$$lock_generation" --quiet >/dev/null 2>&1 || true
        }

        gateway="$$RESOURCE_PREFIX-gateway"
        candidate_gateway="$$gateway-rel-$$SHORT_SHA"
        gateway_attempted=false
        previous_gateway=""
        rollout_complete=false
        workers=(outbox reconciliation compliance ai-act)
        previous_revisions=()
        attempted_workers=()
        attempted_revisions=()

        restore_gateway() {
          if test "$$gateway_attempted" != true; then
            return 0
          fi
          gateway_status="$$(gcloud run services describe "$$gateway" --project="$$DEPLOY_PROJECT_ID" --region="$$REGION" --format=json 2>/dev/null || true)"
          active_gateway="$$(python3 -c 'import json, sys; data=json.load(sys.stdin); print(next((route["revisionName"] for route in data.get("status", {}).get("traffic", ()) if route.get("percent") == 100), ""))' <<<"$$gateway_status" 2>/dev/null || true)"
          if test "$$active_gateway" = "$$candidate_gateway"; then
            gcloud run services update-traffic "$$gateway" --project="$$DEPLOY_PROJECT_ID" --region="$$REGION" --to-revisions="$$previous_gateway=100" || true
          elif test "$$active_gateway" != "$$previous_gateway"; then
            echo "skipped stale gateway restore; active revision is $$active_gateway"
          fi
        }

        restore_workers() {
          for index in "$${!attempted_workers[@]}"; do
            worker="$${attempted_workers[$$index]}"
            previous_revision="$${attempted_revisions[$$index]}"
            pool="$$RESOURCE_PREFIX-$$worker-worker"
            candidate="$$pool-rel-$$SHORT_SHA"
            active="$$(gcloud run worker-pools describe "$$pool" --project="$$DEPLOY_PROJECT_ID" --region="$$REGION" --format='value(status.instanceSplits[0].revisionName)' 2>/dev/null || true)"
            if test "$$active" = "$$candidate"; then
              gcloud run worker-pools update-instance-split "$$pool" --project="$$DEPLOY_PROJECT_ID" --region="$$REGION" --to-revisions="$$previous_revision=100" || true
            elif test "$$active" != "$$previous_revision"; then
              echo "skipped stale restore for $$pool; active revision is $$active"
            fi
          done
        }

        cleanup_rollout() {
          if test "$$rollout_complete" != true; then
            restore_gateway || true
            restore_workers || true
          fi
          release_lock
        }
        trap cleanup_rollout EXIT
        trap 'exit 1' INT TERM

        latest_build="$$(gcloud builds list --project="$$DEPLOY_PROJECT_ID" --region="$$REGION" --filter="buildTriggerId:$$DEPLOY_TRIGGER_ID AND status=(QUEUED OR PENDING OR WORKING OR SUCCESS)" --sort-by=~createTime --limit=1 --format='value(id)')"
        test "$$latest_build" = "$$BUILD_ID" || { echo "a newer main deployment superseded this build"; exit 1; }

        for worker in "$${workers[@]}"; do
          pool="$$RESOURCE_PREFIX-$$worker-worker"
          previous_revision="$$(gcloud run worker-pools describe "$$pool" --project="$$DEPLOY_PROJECT_ID" --region="$$REGION" --format='value(status.instanceSplits[0].revisionName)')"
          test -n "$$previous_revision" || { echo "active revision not found for $$pool"; exit 1; }
          previous_revisions+=("$$previous_revision")
        done

        promote_worker() {
          worker="$$1"
          previous_revision="$$2"
          pool="$$RESOURCE_PREFIX-$$worker-worker"
          candidate="$$pool-rel-$$SHORT_SHA"
          attempted_workers+=("$$worker")
          attempted_revisions+=("$$previous_revision")
          gcloud run worker-pools update-instance-split "$$pool" --project="$$DEPLOY_PROJECT_ID" --region="$$REGION" --to-revisions="$$candidate=100" || return
          status="$$(gcloud run worker-pools describe "$$pool" --project="$$DEPLOY_PROJECT_ID" --region="$$REGION" --format='value(status.latestReadyRevisionName,status.instanceSplits[0].revisionName,status.instanceSplits[0].percent)')" || return
          read -r latest_ready active percent <<<"$$status"
          test "$$latest_ready" = "$$candidate" && test "$$active" = "$$candidate" && test "$$percent" = "100" || return
          success_filter=""
          case "$$worker" in
            outbox) marker="Outbox worker started" ;;
            reconciliation) marker="Gateway reconciliation worker started" ;;
            compliance) marker="Compliance sweep completed"; success_filter=' AND jsonPayload.message:"errors=0"' ;;
            ai-act) marker="Audit maintenance completed" ;;
          esac
          log_filter="resource.type=\"cloud_run_worker_pool\" AND resource.labels.worker_pool_name=\"$$pool\" AND resource.labels.revision_name=\"$$candidate\""
          for attempt in {1..12}; do
            sleep 5
            errors="$$(gcloud logging read "$$log_filter AND (severity>=ERROR OR jsonPayload.level=(\"ERROR\" OR \"CRITICAL\"))" --project="$$DEPLOY_PROJECT_ID" --freshness=5m --limit=1 --format='value(timestamp)')" || return
            test -z "$$errors" || return
            started="$$(gcloud logging read "$$log_filter AND jsonPayload.message:\"$$marker\"$$success_filter" --project="$$DEPLOY_PROJECT_ID" --freshness=5m --limit=1 --format='value(timestamp)')" || return
            if test "$$attempt" -ge 4 && test -n "$$started"; then
              return 0
            fi
          done
          return 1
        }

        for index in "$${!workers[@]}"; do
          worker="$${workers[$$index]}"
          if ! promote_worker "$$worker" "$${previous_revisions[$$index]}"; then
            echo "candidate runtime check failed for $$RESOURCE_PREFIX-$$worker-worker"
            exit 1
          fi
        done

        if ! gateway_status="$$(gcloud run services describe "$$gateway" --project="$$DEPLOY_PROJECT_ID" --region="$$REGION" --format=json)"; then
          exit 1
        fi
        if ! previous_gateway="$$(python3 -c 'import json, sys; print(next(route["revisionName"] for route in json.load(sys.stdin)["status"]["traffic"] if route.get("percent") == 100))' <<<"$$gateway_status")"; then
          echo "active gateway revision not found"
          exit 1
        fi

        promote_gateway() {
          gateway_attempted=true
          gcloud run services update-traffic "$$gateway" --project="$$DEPLOY_PROJECT_ID" --region="$$REGION" --to-revisions="$$candidate_gateway=100" || return
          service_url="$$(gcloud run services describe "$$gateway" --project="$$DEPLOY_PROJECT_ID" --region="$$REGION" --format='value(status.url)')" || return
          test -n "$$service_url" || return
          python3 - "$$service_url/health" <<'PY'
        import json
        import sys
        import urllib.request

        with urllib.request.urlopen(sys.argv[1], timeout=30) as response:
            payload = json.load(response)

        expected = {
            "status": "ok",
            "database": "connected",
            "redis": "connected",
        }
        if any(payload.get(key) != value for key, value in expected.items()):
            raise SystemExit(f"production gateway health failed: {payload}")
        PY
        }

        if ! promote_gateway; then
          exit 1
        fi
        rollout_complete=true

