      - --set-env-vars=ENVIRONMENT=production,SECRET_BACKEND=gcp_secret_manager,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,LOG_LEVEL=INFO,OTEL_SERVICE_NAME=${_RESOURCE_PREFIX}-compliance-worker,DATABASE_POOL_SIZE=${_DATABASE_POOL_SIZE},DATABASE_MAX_OVERFLOW=${_DATABASE_MAX_OVERFLOW}

