services:
  valkey:
    image: valkey/valkey:8.1-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    command: [valkey-server, --appendonly, 'yes']
    ports: ['127.0.0.1:56381:6379']
    volumes: [valkey_data:/data]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5@sha256:357829ec7c4693397533035092ad13b0644bcc95ded311f33a3738c4d9e9bdba
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-password
    ports: ['127.0.0.1:58080:8080']
    volumes: ['./realm.json:/opt/keycloak/data/import/realm.json:ro']
volumes:
  valkey_data:
