# Control ids and titles come from the 3 September 2026 coverage matrix, which compiled
# them from secondary sources. Set verified_against_standard to true only after they are
# checked against the purchased ISO/IEC 42001 text.
framework: iso42001
title: ISO/IEC 42001 Annex A readiness
verified_against_standard: false
controls:
  - id: A.2.2
    title: AI policy
    source: input
    evidence: inventory
    rule: Present when the window has requests; the models, providers, teams and data categories in use scope the policy.
  - id: A.2.3
    title: Alignment with other organisational policies
    source: declared
  - id: A.2.4
    title: Review of the AI policy
    source: declared
  - id: A.3.2
    title: AI roles and responsibilities
    source: declared
  - id: A.3.3
    title: Reporting of concerns
    source: declared
  - id: A.4.2
    title: Resource documentation
    source: measured
    evidence: resource_documentation
    rule: Present when at least one deployment is registered and every registered deployment names an owner and a declared version.
  - id: A.4.3
    title: Data resources
    source: input
    evidence: inventory
    rule: Present when the window has requests; only runtime data is seen, never training data.
  - id: A.4.4
    title: Tooling resources
    source: measured
    evidence: tooling
    rule: Present when at least one provider served a request in the window.
  - id: A.4.5
    title: System and computing resources
    source: declared
  - id: A.4.6
    title: Human resources
    source: declared
  - id: A.5.2
    title: AI system impact assessment process
    source: declared
  - id: A.5.3
    title: Documentation of impact assessments
    source: declared
  - id: A.5.4
    title: Impact on individuals or groups
    source: input
    evidence: personal_data
    rule: Present when the window has requests; personal data types by provider are input to the assessment.
  - id: A.5.5
    title: Societal impacts
    source: declared
  - id: A.6.1.2
    title: Objectives for responsible development
    source: declared
  - id: A.6.1.3
    title: Processes for responsible design and development
    source: declared
  - id: A.6.2.2
    title: AI system requirements and specification
    source: declared
  - id: A.6.2.3
    title: Documentation of design and development
    source: declared
  - id: A.6.2.4
    title: Verification and validation
    source: declared
  - id: A.6.2.5
    title: AI system deployment
    source: declared
  - id: A.6.2.6
    title: Operation and monitoring
    source: measured
    evidence: operation
    rule: Present when the window has requests and at least one of them has an audit row.
  - id: A.6.2.7
    title: Technical documentation
    source: declared
  - id: A.6.2.8
    title: Recording of event logs
    source: measured
    evidence: event_logs
    rule: Present when the window has audit rows, the chain verifies and retention is at least 180 days.
  - id: A.7.2
    title: Data for development and enhancement
    source: declared
  - id: A.7.3
    title: Acquisition of data
    source: declared
  - id: A.7.4
    title: Quality of data
    source: declared
  - id: A.7.5
    title: Data provenance
    source: declared
  - id: A.7.6
    title: Data preparation
    source: declared
  - id: A.8.2
    title: System documentation and information for users
    source: declared
  - id: A.8.3
    title: External reporting
    source: declared
  - id: A.8.4
    title: Communication of incidents
    source: declared
  - id: A.8.5
    title: Information for interested parties
    source: declared
  - id: A.9.2
    title: Processes for responsible use
    source: measured
    evidence: responsible_use
    rule: Present when at least one request in the window carries both a privacy.input verdict and an admission verdict.
  - id: A.9.3
    title: Objectives for responsible use
    source: declared
  - id: A.9.4
    title: Intended use of the AI system
    source: input
    evidence: intended_use
    rule: Present when the window has requests; the share with a tag or cost center is input to the statement of intended use, not proof of it.
  - id: A.10.2
    title: Allocation of responsibilities
    source: declared
  - id: A.10.3
    title: Suppliers
    source: measured
    evidence: suppliers
    rule: Present when at least one provider served a request in the window.
  - id: A.10.4
    title: Customers
    source: declared
