[project]
name = "shim-gateway"
version = "0.1.0"
description = "High-performance B2B AI Gateway & Optimization Platform"
authors = [{ name = "SHIM Engineering" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.109,<1",
  "starlette>=1.3,<2",
  "uvicorn[standard]>=0.27,<1",
  "httpx>=0.28,<1",
  "openai==2.53.0",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.1,<3",
  "presidio-analyzer>=2.2.363,<2.3",
  "python-json-logger>=2.0.7,<3",
  "sentry-sdk>=2.48,<3",
  "opentelemetry-api>=1.43,<2",
  "opentelemetry-sdk>=1.43,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.43,<2",
  "prometheus-client>=0.25,<1",
  "anthropic==0.121.0",
  "google-genai==2.16.0",
]

[project.scripts]
shim = "shim.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0.0,<9",
  "pytest-asyncio>=1.3.0,<2",
  "pyyaml>=6.0.2,<7",
  "ruff>=0.15.0,<0.16",
  "ty>=0.0.65,<0.1",
]

[tool.uv]
required-version = ">=0.12.5,<0.13"

[tool.uv.workspace]
members = ["ee"]

[tool.ty.src]
include = ["src", "ee/src"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.build-backend]
module-name = "shim"
module-root = "src"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
